[project]
name = "vael-mux"
version = "0.1.0"
description = "Vael-Mux: subscription aggregator, tester, router and multi-protocol proxy client"
license = { text = "GPL-3.0-or-later" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "aiohttp>=3.9",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
vael-mux = "vael_mux.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vael_mux*"]

[tool.setuptools.package-data]
"vael_mux.web" = ["static/*"]