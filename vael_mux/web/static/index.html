<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Vael-Mux 控制台</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>

<body>
    <header>
        <h1>Vael-Mux</h1>
        <div class="status" id="kernel-status">内核: —</div>
    </header>

    <nav>
        <button class="tab active" data-tab="overview">概览</button>
        <button class="tab" data-tab="nodes">节点</button>
        <button class="tab" data-tab="config">配置</button>
        <button class="tab" data-tab="logs">日志</button>
    </nav>

    <main>

        <section id="tab-overview" class="tab-panel active">
            <div class="toolbar">
                <button id="btn-refresh">全量刷新</button>
                <button id="btn-alive">测活</button>
                <button id="btn-speed">测速</button>
            </div>
            <div class="cards">
                <div class="card">
                    <div class="k">订阅节点</div>
                    <div class="v" id="stat-nodes">—</div>
                </div>
                <div class="card">
                    <div class="k">存活</div>
                    <div class="v" id="stat-alive">—</div>
                </div>
                <div class="card">
                    <div class="k">排序模式</div>
                    <div class="v" id="stat-mode">—</div>
                </div>
                <div class="card">
                    <div class="k">上次刷新</div>
                    <div class="v" id="stat-last">—</div>
                </div>
            </div>
            <h3>导出订阅</h3>
            <div class="toolbar">
                <a class="btn" href="/api/export/mihomo" target="_blank">mihomo YAML</a>
                <a class="btn" href="/api/export/v2ray" target="_blank">V2Ray Base64</a>
            </div>
        </section>

        <section id="tab-nodes" class="tab-panel">
            <div class="toolbar">
                <button id="btn-nodes-reload">刷新列表</button>
                <input id="node-filter" placeholder="搜索节点名 / 服务器" />
            </div>
            <table id="nodes-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>名称</th>
                        <th>协议</th>
                        <th>服务器</th>
                        <th>端口</th>
                        <th>存活</th>
                        <th>延迟(ms)</th>
                        <th>速度(Mbps)</th>
                        <th>稳定性</th>
                        <th>评分</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>

        <section id="tab-config" class="tab-panel">
            <div class="toolbar">
                <button id="btn-cfg-load">重新加载</button>
                <button id="btn-cfg-save">保存配置</button>
            </div>
            <textarea id="cfg-editor" spellcheck="false"></textarea>
            <div id="cfg-msg"></div>
        </section>

        <section id="tab-logs" class="tab-panel">
            <div class="toolbar">
                <button id="btn-clear-logs">清屏</button>
                <span class="hint">实时日志 (WebSocket)</span>
            </div>
            <pre id="log-view"></pre>
        </section>

    </main>

    <script src="/static/app.js"></script>
</body>

</html>
